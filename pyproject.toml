[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chess-puzzles"
version = "0.1.0"
description = "A reproduction of the Chess Puzzles benchmark (100 FEN best-move items) as an Inspect AI task"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["inspect-ai>=0.3.146"]

[project.entry-points.inspect_ai]
chess_puzzles = "chess_puzzles._registry"

[tool.hatch.build.targets.wheel]
packages = ["src/chess_puzzles"]
